<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スキャンツール</title>
<meta name="theme-color" content="#1e6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキャン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, content list, fixed action bar at the bottom. Image stage on graph paper. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#17221f; --muted:#5d6b67; --line:#d3dcd9;
  --accent:#1e6b55; --accent-ink:#ffffff; --chalk:#b07708; --err:#b03a2e; --ok:#2e7d4f;
  --grid:rgba(30,107,85,.10); --shade:rgba(10,20,17,.45);
  --font-ui:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --font-math:"Hiragino Mincho ProN","Yu Mincho",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#18211e; --ink:#e6eeeb; --muted:#93a39e; --line:#2b3834;
  --accent:#4fb393; --accent-ink:#08130f; --chalk:#e0b04a; --err:#e0705f; --ok:#5cc08a;
  --grid:rgba(79,179,147,.10); --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18211e; --ink:#e6eeeb; --muted:#93a39e; --line:#2b3834;
  --accent:#4fb393; --accent-ink:#08130f; --chalk:#e0b04a; --err:#e0705f; --ok:#5cc08a;
  --grid:rgba(79,179,147,.10); --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
header.top h1{flex:1;min-width:0;margin:0;font-size:19px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:none;background:none;padding:6px 8px;border-radius:8px;font-size:15px;color:var(--accent);font-weight:500}
.iconbtn:active{background:var(--line)}
.banner{margin-block:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--chalk);color:var(--chalk);font-size:14px}
.section-label{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-block:18px 6px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:none}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .thumb{width:44px;height:58px;border-radius:5px;object-fit:cover;background:var(--line);flex:none}
.folder-ico{width:36px;height:28px;flex:none;border-radius:4px 4px 6px 6px;background:var(--accent);opacity:.85;position:relative}
.folder-ico::before{content:"";position:absolute;left:0;top:-5px;width:15px;height:7px;border-radius:3px 3px 0 0;background:inherit}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);aspect-ratio:3/4;padding:0;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;object-position:top}
.tile .no{position:absolute;left:6px;top:6px;font-size:12px;background:var(--shade);color:#fff;border-radius:9px;padding:0 7px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.run{color:var(--chalk);border-color:var(--chalk)} .chip.err{color:var(--err);border-color:var(--err)} .chip.warn{color:var(--chalk);border-color:var(--chalk)}
.tile .chip{position:absolute;right:5px;bottom:5px}
.grid#grid{gap:4px;grid-template-columns:repeat(3,minmax(0,1fr));touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid#grid .tile{border:none;border-radius:4px}
.tile .dot{position:absolute;left:6px;bottom:6px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.tile .dot.ok{background:var(--ok)} .tile .dot.warn,.tile .dot.run{background:var(--chalk)} .tile .dot.err{background:var(--err)}
.folder-thumb{display:flex;align-items:center;justify-content:center}
.tile .check{display:none;position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--shade)}
.grid .tile img{transition:transform .12s}
.tile.picked .check{display:block}
.tile.picked{outline:3px solid var(--accent);outline-offset:-3px}
.tile.picked img{transform:scale(.92)}
.tile.picked .check{background:var(--accent);border-color:var(--accent)}
.tile.picked .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{flex:none;min-height:36px;border-radius:9px;font-size:14px;font-weight:500;padding:0 12px}
.stage{margin-top:12px;border-radius:12px;padding:12px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;border:1px solid var(--line);text-align:center}
.stage img.page{max-width:100%;max-height:62vh;box-shadow:0 2px 10px var(--shade);background:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-top:12px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:7px 0;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.crop{position:relative;display:inline-block;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.crop img{display:block;max-width:100%;max-height:62vh}
.crop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.crop .edge{fill:rgba(79,179,147,.18);stroke:var(--accent);stroke-width:2}
.crop circle,.crop rect{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.loupe{position:fixed;z-index:30;width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);background-color:var(--surface);background-repeat:no-repeat;box-shadow:0 4px 14px var(--shade);pointer-events:none}
.loupe::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid var(--accent);border-radius:50%}
.doc{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--font-math);font-size:16px;line-height:1.85;overflow-x:auto;min-width:0}
.doc p{margin:.2em 0} .doc h2{font-family:var(--font-ui);font-size:18px;margin:.5em 0 .2em} .doc h3,.doc h4{font-family:var(--font-ui);font-size:16px;margin:.4em 0 .2em}
.doc table{border-collapse:collapse;margin:8px auto} .doc td{border:1px solid var(--muted);padding:2px 10px;text-align:center}
.doc img{display:block;max-width:100%;margin:8px auto;border:1px dashed var(--line)}
.doc .wait{font-family:var(--font-mono);font-size:13px;color:var(--muted);white-space:pre-wrap}
.doc mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
textarea.tex{width:100%;min-height:260px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font-family:var(--font-mono);font-size:13px;line-height:1.55}
.issues{margin-top:10px;font-size:14px;color:var(--chalk);border-left:3px solid var(--chalk);padding-left:10px}
.err{margin-top:10px;font-size:14px;color:var(--err)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.sheet .btns{display:flex;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.opt input{margin-top:4px}
.opt small{display:block;color:var(--muted);font-size:13px}
.cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam polygon{fill:rgba(255,200,40,.12);stroke:#ffc828;stroke-width:3;stroke-linejoin:round;transition:all .18s}
.cam polygon.ok{fill:rgba(79,179,147,.22);stroke:#4fd3a3}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}.cam-flash.on{opacity:.8}
.cam-top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 10px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000a,#0000)}
.cam-hint{flex:1;text-align:center;font-size:14px;margin-right:60px}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:linear-gradient(#0000,#000b)}
.cam-shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff3}
.cam-shutter:active{background:#fff8}
.cam-side{border:none;background:#0008;color:#fff;border-radius:18px;padding:8px 12px;font-size:14px;justify-self:start}
.cam-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cam-side.done{background:#fff;color:#000;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.94}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="picIn" accept="image/*,application/pdf,.pdf" multiple hidden>
<div class="toast" id="toast"></div>

<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']],
         processEnvironments: true, packages: {'[+]': ['noerrors']},
         macros: { bm: ['\\boldsymbol{#1}', 1] } },

<script src="detector.js"></script>
<script>
"use strict";
/* =====================================================================
   スキャンツール — 撮影 → 補正 → Claudeで文字起こし → 文字付きPDF / TeX
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
const today = () => { const d = new Date(); return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}時${String(d.getMinutes()).padStart(2,'0')}分`; };

/* ---------- 状態の記録（うまく動かないときに「設定 → 動作の状態」で見られるように） ---------- */
const Diag = { caps: {}, errors: [], log(where, e){ this.errors.push(`${new Date().toLocaleTimeString()} ${where}: ${e?.code || ''} ${e?.message || e}`.slice(0, 220)); if (this.errors.length > 12) this.errors.shift(); } };
window.addEventListener('error', e => Diag.log('error', e.error || e.message));
window.addEventListener('unhandledrejection', e => Diag.log('promise', e.reason));

/* ---------------------------------------------------------------------
   保存先：このiPhone（ブラウザ）の中の IndexedDB。ネットに上げない
   --------------------------------------------------------------------- */
const IDB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('scan-tool', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('pages', { keyPath: 'id' }); d.createObjectStore('blobs'); };
      r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), q = fn(t.objectStore(store));
      t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('保存が中断されました（空き容量を確認）'));
    });
  },
};
const Store = {
  mode: 'local',
  lib: { folders: [], scans: [], settings: { tier: 'default', autofix: true, filter: 'scan', engine: 'claude', apiKey: '', auto: true, autoOcr: true, hiRes: false } },
  urls: new Map(), loading: new Set(),
  async init(){
    try{
      await IDB.open();
      const v = await IDB.req('kv', 'readonly', s => s.get('library'));
      if (v) this.lib = { folders: v.folders || [], scans: [], settings: { ...this.lib.settings, ...(v.settings || {}) } };
      if (this.lib.settings.engine === 'auto') this.lib.settings.engine = 'claude'; // 旧版の「おまかせ」→ Claude
      navigator.storage?.persist?.().catch(() => {}); // iPhoneが勝手に消さないようにお願いする
    }catch(e){ console.warn('idb', e); Diag.log('init', e); this.mode = 'memory'; }
  },
  saveLib(){
    if (this.mode !== 'local') return Promise.resolve();
    const body = JSON.parse(JSON.stringify(this.lib));
    return IDB.req('kv', 'readwrite', s => s.put(body, 'library')).catch(e => { Diag.log('saveLib', e); toast('保存に失敗しました（空き容量を確認してください）'); });
  },
  async loadPages(f){
    if (this.mode !== 'local') return [];
    const out = [];
    for (const id of f.pages || []){ const p = await IDB.req('pages', 'readonly', s => s.get(id)); if (p) out.push(p); }
    return out;
  },
  savePage(p){
    p.updated = Date.now();
    if (this.mode !== 'local') return Promise.resolve();
    const body = JSON.parse(JSON.stringify({ ...p, live: undefined }));
    return IDB.req('pages', 'readwrite', s => s.put(body)).catch(e => { Diag.log('savePage', e); toast('保存に失敗しました（空き容量を確認してください）'); });
  },
  deletePage(p){ return this.mode === 'local' ? IDB.req('pages', 'readwrite', s => s.delete(p.id)).catch(() => {}) : Promise.resolve(); },
  async upload(blob){
    const id = newId();
    if (this.mode === 'local') await IDB.req('blobs', 'readwrite', s => s.put(blob, id));
    this.urls.set(id, URL.createObjectURL(blob));
    return id;
  },
  async blob(id){ return this.mode === 'local' ? IDB.req('blobs', 'readonly', s => s.get(id)) : null; },
  // 画面の <img> 用。まだ読み込んでいなければ読み込んでから描き直す
  url(id){
    if (!id) return '';
    const u = this.urls.get(id); if (u) return u;
    if (!this.loading.has(id)){
      this.loading.add(id);
      this.blob(id).then(b => { if (b){ this.urls.set(id, URL.createObjectURL(b)); scheduleRender(); } }).finally(() => this.loading.delete(id));
    }
    return 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
  },
  async dropAsset(id){
    if (!id) return;
    const u = this.urls.get(id); if (u) URL.revokeObjectURL(u); this.urls.delete(id);
    if (this.mode === 'local') await IDB.req('blobs', 'readwrite', s => s.delete(id)).catch(() => {});
  },
};
let renderTimer = null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(() => { if (!S.cropping && S.view !== 'camera') render(); }, 60); }
async function assetCanvas(id){
  const b = await Store.blob(id);
  if (!b) return urlToCanvas(Store.urls.get(id) || '');
  let src; try{ src = await createImageBitmap(b); }catch{ src = await loadImage(URL.createObjectURL(b)); }
  const c = makeCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); src.close?.();
  return c;
}

/* ---------------------------------------------------------------------
   画像処理：読み込み、紙の四隅の自動検出、台形補正、影除去
   --------------------------------------------------------------------- */
// iPhoneは画面内のcanvasの合計サイズに上限があるので、使い終わったら必ず0にして手放す
function freeCanvas(...cs){ for (const c of cs) if (c && c.width){ c.width = 0; c.height = 0; } }
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
const toBlob = (c, q = 0.9) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('画像の書き出しに失敗（メモリ不足の可能性）')), 'image/jpeg', q));
function loadImage(src){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('画像を読み込めません')); im.src = src; });
}
async function fileToCanvas(file, maxSide = 2400){
  let src;
  try{ src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch{ src = await loadImage(URL.createObjectURL(file)); }
  const r = Math.min(1, maxSide / Math.max(src.width, src.height));
  const c = makeCanvas(src.width * r, src.height * r);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  src.close?.();
  return c;
}
async function urlToCanvas(url){
  const im = await loadImage(url);
  const c = makeCanvas(im.naturalWidth, im.naturalHeight);
  c.getContext('2d').drawImage(im, 0, 0);
  return c;
}
function grayOf(canvas, maxSide){
  const r = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
  const c = makeCanvas(canvas.width * r, canvas.height * r);
  const ctx = c.getContext('2d'); ctx.drawImage(canvas, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  const g = new Uint8Array(c.width * c.height);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j+1] * 150 + d[j+2] * 29) >> 8;
  const out = { g, w: c.width, h: c.height, r }; freeCanvas(c);
  return out;
}
function otsu(g){
  const hist = new Array(256).fill(0); for (const v of g) hist[v]++;

// 戻り値 {tex, figs:[{name, box}]}
function mdToTex(md, prefix){
  const store = [], figs = [];
  const keep = s => `\u0000B${store.push(s) - 1}\u0000`;
  let t = (md || '').replace(/\r\n/g, '\n');
  t = t.replace(BBOX_RE, (_, a, b, c, d) => {
    const box = [+a, +b, +c, +d]; if (box[2] <= box[0] || box[3] <= box[1]) return '';
    const name = `${prefix}_${figs.length + 1}.jpg`; figs.push({ name, box });
    const wd = Math.min(1, Math.max(.15, (box[2] - box[0]) / 1000 * 1.15)).toFixed(2);
    return '\n\n' + keep(`\\begin{center}\n\\includegraphics[width=${wd}\\linewidth]{figs/${name}}\n\\end{center}`) + '\n\n';
  });
  t = t.replace(/<table\b[\s\S]*?<\/table>/gi, m => '\n\n' + keep(tableTex(m)) + '\n\n');
  t = protectMath(t, store);
  const out = []; let inList = false;
  for (const raw of t.split('\n')){
    const s = raw.trim(), item = raw.match(/^\s*[-*+・]\s+(.*)$/);
    if (item && !s.startsWith('\u0000')){ if (!inList){ out.push('\\begin{itemize}'); inList = true; } out.push('  \\item ' + inlineMd(item[1])); continue; }
    if (inList){ out.push('\\end{itemize}'); inList = false; }
    if (!s){ out.push(''); continue; }
    const hm = s.match(/^(#{1,6})\s+(.*)$/);
    if (hm){ out.push(`\\${['', 'section', 'subsection'][hm[1].length] || 'subsubsection'}*{${inlineMd(hm[2])}}`, ''); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(s)){ out.push('\\noindent\\rule{\\linewidth}{0.4pt}', ''); continue; }
    out.push(inlineMd(s), '');
  }
  if (inList) out.push('\\end{itemize}');
  let body = out.join('\n');
  for (let i = 0; i < 3; i++) body = body.replace(/\u0000[BM](\d+)\u0000/g, (_, k) => store[+k]);

}
function buildTexDoc(pages){
  const parts = [PREAMBLE, '\\begin{document}', ''];
  pages.forEach(p => { if (p.tex?.trim()){ parts.push(`% ===== p.${p.n} =====`, p.tex.trim(), ''); } });
  parts.push('\\end{document}');
  return parts.join('\n') + '\n';
}

/* ---------------------------------------------------------------------
   LaTeX本文 → 画面表示（MathJaxで数式を描く）
   --------------------------------------------------------------------- */
function texToHtml(tex){
  const keep = []; const hold = s => `\u0000${keep.push(s) - 1}\u0000`;
  tex = tex.replace(/^\s*%.*$/gm, '');
  tex = tex.replace(/\\begin\{(equation|align|gather|multline)\*?\}[\s\S]+?\\end\{\1\*?\}|\\\[[\s\S]+?\\\]|\$\$[\s\S]+?\$\$|\\\([\s\S]+?\\\)|\$(?:\\\$|[^$])+?\$/g, m => hold(esc(m)));
  tex = tex.replace(/\\begin\{tabular\}\{[^}]*\}([\s\S]*?)\\end\{tabular\}/g, (_, body) => {
    const rows = body.replace(/\\hline|\\cline\{[^}]*\}/g, '').split(/\\\\/).map(r => r.trim()).filter(Boolean);
    return hold('<div style="overflow-x:auto"><table>' + rows.map(r => '<tr>' + r.split(/(?<!\\)&/).map(c => {
      c = c.trim(); let span = 1;
      const mc = c.match(/^\\multicolumn\{(\d+)\}\{[^}]*\}\{([\s\S]*)\}$/); if (mc){ span = +mc[1]; c = mc[2]; }
      const mr = c.match(/^\\multirow\{\d+\}\{[^}]*\}\{([\s\S]*)\}$/); if (mr) c = mr[1];
      return `<td colspan="${span}">${inline(c)}</td>`;
    }).join('') + '</tr>').join('') + '</table></div>');
  });
  tex = tex.replace(/\\includegraphics(\[[^\]]*\])?\{figs\/([^}]+)\}/g, (_, o, n) => hold(`<img data-fig="${esc(n)}" alt="図">`));
  tex = tex.replace(/\\begin\{itemize\}/g, hold('<ul>')).replace(/\\end\{itemize\}/g, hold('</ul>')).replace(/\\item\s*/g, hold('<li>'));
  tex = tex.replace(/\\(begin|end)\{center\}/g, '').replace(/\\noindent\\rule\{[^}]*\}\{[^}]*\}/g, hold('<hr>'));
  tex = tex.replace(/\\section\*?\{([^}]*)\}/g, (_, t) => hold(`<h2>${inline(t)}</h2>`))
           .replace(/\\subsection\*?\{([^}]*)\}/g, (_, t) => hold(`<h3>${inline(t)}</h3>`))
           .replace(/\\subsubsection\*?\{([^}]*)\}/g, (_, t) => hold(`<h4>${inline(t)}</h4>`));
  let out = tex.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => /^\u0000\d+\u0000$/.test(p) ? p : `<p>${inline(p)}</p>`).join('\n');
  for (let i = 0; i < 3; i++) out = out.replace(/\u0000(\d+)\u0000/g, (_, k) => keep[+k]);
  return out;
}
function inline(s){
  s = esc(s).replace(/\\textbf\{([^{}]*)\}/g, '<b>$1</b>').replace(/\\textit\{([^{}]*)\}/g, '<i>$1</i>').replace(/\\texttt\{([^{}]*)\}/g, '<code>$1</code>');
  return s.replace(/\\(&amp;|%|#|_)/g, '$1').replace(/\\textasciitilde\{\}/g, '~').replace(/\\textasciicircum\{\}/g, '^').replace(/\\\\/g, '<br>');
}
async function typeset(el){
  try{ if (window.MathJax?.typesetPromise){ MathJax.typesetClear?.([el]); await MathJax.typesetPromise([el]); } }catch(e){ console.warn(e); }
}
async function cropFig(p, box){
  const c = await assetCanvas(p.img), W = c.width, H = c.height, pad = 8;
  const x1 = Math.max(0, box[0] / 1000 * W - pad), y1 = Math.max(0, box[1] / 1000 * H - pad);
  const x2 = Math.min(W, box[2] / 1000 * W + pad), y2 = Math.min(H, box[3] / 1000 * H + pad);
  const o = makeCanvas(x2 - x1, y2 - y1); o.getContext('2d').drawImage(c, x1, y1, x2 - x1, y2 - y1, 0, 0, o.width, o.height);
  freeCanvas(c); return o;
}

/* ---------------------------------------------------------------------
   文字付きPDF（ページ画像＋透明な文字）を自前で組み立てる
   --------------------------------------------------------------------- */
function mdToLines(md){
  let t = (md || '').replace(/<table\b[\s\S]*?<\/table>/gi, m => '\n' + [...new DOMParser().parseFromString(m, 'text/html').querySelectorAll('tr')]
    .map(tr => [...tr.children].map(c => c.textContent.trim()).join('  ')).join('\n') + '\n');
  t = t.replace(BBOX_RE, '').replace(/<[^>]+>/g, '');
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => m.replace(/\n/g, ' ')).replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => m.replace(/\n/g, ' '));
  t = t.replace(/\$/g, '').replace(/\\\(|\\\)/g, '').replace(/^#{1,6}\s*/gm, '').replace(/\*\*(.+?)\*\*/g, '$1');
  return unhtml(t).split('\n').map(s => s.trim()).filter(Boolean);
}
function lineBands(canvas){
  const { g, w, h, r } = grayOf(canvas, 1400), th = otsu(g), m = Math.round(w * .015);
  const prof = new Array(h).fill(0);
  for (let y = 0; y < h; y++) for (let x = m; x < w - m; x++) if (g[y*w+x] < th) prof[y]++;
  const on = prof.map(v => v > Math.max(2, w * .004));
  const bands = []; let s = null;
  on.concat([false]).forEach((v, y) => { if (v && s === null) s = y; else if (!v && s !== null){ bands.push([s, y]); s = null; } });
  if (!bands.length) return [];
  const med = bands.map(b => b[1] - b[0]).sort((a, b) => a - b)[bands.length >> 1];
  const merged = [bands[0].slice()];
  for (const b of bands.slice(1)){ const L = merged[merged.length - 1]; if (b[0] - L[1] < med * .35) L[1] = b[1]; else merged.push(b.slice()); }
  const out = [];
  for (const [y0, y1] of merged){
    if (y1 - y0 < Math.max(3, med * .3)) continue;
    let x0 = -1, x1 = -1;
    for (let x = m; x < w - m; x++){ let any = false; for (let y = y0; y < y1; y++) if (g[y*w+x] < th){ any = true; break; } if (any){ if (x0 < 0) x0 = x; x1 = x + 1; } }
    if (x0 >= 0) out.push([x0 / r, y0 / r, x1 / r, y1 / r]);
  }

}
function utf16hex(s){ let h = ''; for (const ch of s){ const c = ch.codePointAt(0); if (c > 0xFFFF) continue; h += c.toString(16).padStart(4, '0'); } return h.toUpperCase(); }

async function buildPdf(pages){
  const enc = new TextEncoder(), chunks = [], offsets = []; let pos = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); pos += b.length; };
  const objs = []; // 番号は 1 から
  const reserve = () => objs.push(null);
  const PX2PT = 72 / 200;
  const CATALOG = reserve(), PAGES = reserve(), FONT = reserve(), CID = reserve(), DESC = reserve();
  const pageNums = [];

  put(FONT, [`<< /Type /Font /Subtype /Type0 /BaseFont /HeiseiKakuGo-W5-UniJIS-UCS2-H /Encoding /UniJIS-UCS2-H /DescendantFonts [${CID} 0 R] >>`]);
  put(CID, [`<< /Type /Font /Subtype /CIDFontType0 /BaseFont /HeiseiKakuGo-W5 /CIDSystemInfo << /Registry (Adobe) /Ordering (Japan1) /Supplement 2 >> /FontDescriptor ${DESC} 0 R /DW 1000 /W [1 95 500 231 389 500] >>`]);
  put(DESC, [`<< /Type /FontDescriptor /FontName /HeiseiKakuGo-W5 /Flags 4 /FontBBox [-92 -250 1010 922] /ItalicAngle 0 /Ascent 752 /Descent -221 /CapHeight 737 /StemV 114 >>`]);
  for (const { canvas, md, rows } of pages){
    const w = canvas.width, h = canvas.height, pw = (w * PX2PT).toFixed(2), ph = (h * PX2PT).toFixed(2);
    const jpg = new Uint8Array(await (await toBlob(canvas, .8)).arrayBuffer());
    const IMG = reserve(), CONTENT = reserve(), PAGE = reserve();
    put(IMG, [`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`, jpg, '\nendstream']);
    let cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q\n`;
    if (rows?.length){ // 行の位置が分かっている：その位置にぴったり重ねる
      cs += 'BT 3 Tr\n';
      for (const r of rows){
        const ln = plainText(r.text); if (!ln) continue;
        const x0 = r.box[0] * w, y0 = r.box[1] * h, x1 = r.box[2] * w, y1 = r.box[3] * h, bh = y1 - y0;
        const size = Math.max(3, bh * 0.82 * PX2PT), target = Math.max(8, (x1 - x0) * PX2PT);

      const nb = bands.length, groups = new Map();
      lines.forEach((ln, i) => { const bi = n === nb ? i : Math.min(nb - 1, Math.floor(i * nb / n)); if (!groups.has(bi)) groups.set(bi, []); groups.get(bi).push(ln); });
      cs += 'BT 3 Tr\n';
      for (const [bi, lns] of groups){
        const [x0, y0, x1, y1] = bands[bi], sub = (y1 - y0) / lns.length;
        lns.forEach((ln, j) => {
          const size = Math.max(4, sub * .85 * PX2PT), target = Math.max(10, (x1 - x0) * PX2PT);
          const tz = Math.max(10, Math.min(400, 100 * target / (textW(ln) * size || 1)));
          const yy = (h - (y0 + sub * j) - sub * .85) * PX2PT;
          cs += `/F1 ${size.toFixed(2)} Tf ${tz.toFixed(1)} Tz 1 0 0 1 ${(x0 * PX2PT).toFixed(2)} ${yy.toFixed(2)} Tm <${utf16hex(ln)}> Tj\n`;
        });
      }
      cs += 'ET\n';
    }
    const csb = enc.encode(cs);
    put(CONTENT, [`<< /Length ${csb.length} >>\nstream\n`, csb, '\nendstream']);

  put(PAGES, [`<< /Type /Pages /Kids [${pageNums.map(n => n + ' 0 R').join(' ')}] /Count ${pageNums.length} >>`]);

  const xref = pos;
  push(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${objs.length + 1} /Root ${CATALOG} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });

/* ---------------------------------------------------------------------
   ZIP（無圧縮）：main.tex ＋ figs/
   --------------------------------------------------------------------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function buildZip(files){ // [{name, data:Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  for (const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const head = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    parts.push(head, nm, f.data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += head.length + nm.length + sz;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

/* ---------- なぞって選択：横になぞると選択／解除、縦はスクロール、長押しでも選択 ---------- */
let suppressUntil = 0; // なぞり・長押しの直後のタップでページが開かないように
function setupGrid(){
  const grid = $('#grid'); if (!grid) return;
  const tileAt = (x, y) => document.elementFromPoint(x, y)?.closest?.('.tile[data-id]');
  let mode = null, start = null, adding = true, lp = null, raf = null, lastY = 0;
  const label = () => { const h1 = $('header.top h1'); if (h1) h1.textContent = S.sel.size ? `${S.sel.size}枚を選択` : (scanOf(S.scan)?.name || ''); };
  const apply = t => {
    if (!t) return;
    const id = t.dataset.id, has = S.sel.has(id);
    if (adding && !has){ S.sel.add(id); t.classList.add('picked'); }
    if (!adding && has){ S.sel.delete(id); t.classList.remove('picked'); }
    label();
  };
  const auto = () => { // 画面の端までなぞると自動スクロール
    const dy = lastY > innerHeight - 150 ? 14 : lastY < 150 ? -14 : 0;
    if (dy) scrollBy(0, dy);
    raf = mode === 'select' ? requestAnimationFrame(auto) : null;
  };
  const begin = (t, e) => {
    mode = 'select'; adding = !S.sel.has(t.dataset.id); apply(t);
    try{ grid.setPointerCapture(e.pointerId); }catch{}
    suppressUntil = Date.now() + 800; raf = requestAnimationFrame(auto);
  };
  grid.onpointerdown = e => {
    const t = e.target.closest('.tile[data-id]'); if (!t) return;
    mode = 'pending'; start = { x: e.clientX, y: e.clientY, t }; lastY = e.clientY;
    lp = setTimeout(() => { if (mode === 'pending'){ navigator.vibrate?.(10); begin(t, e); } }, 420);
  };
  grid.onpointermove = e => {
    if (!mode) return; lastY = e.clientY;
    if (mode === 'pending'){
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.hypot(dx, dy) < 8) return;
      clearTimeout(lp);
      if (Math.abs(dx) > Math.abs(dy)) begin(start.t, e); else { mode = null; return; } // 縦はスクロールに任せる
    }
    e.preventDefault(); apply(tileAt(e.clientX, e.clientY));
  };
  grid.onpointerup = grid.onpointercancel = () => {
    clearTimeout(lp);
    if (mode === 'select'){ cancelAnimationFrame(raf); mode = null; render(); return; }
    mode = null;
  };
  grid.oncontextmenu = e => e.preventDefault();
}

/* ---------- 四隅と縁の調整（丸＝角、四角＝上下の縁の曲がり。拡大鏡つき） ---------- */
// S.cropping = [tl, tr, br, bl, topMid, bottomMid]（0〜1）
function cropFrom(corners, mids){ const q = JSON.parse(JSON.stringify(corners)); return q.concat(JSON.parse(JSON.stringify(mids || straightMids(q)))); }
function setupCrop(){
  const img = $('#cropImg'), svg = $('#cropSvg'), loupe = $('#loupe');
  const draw = () => {
    const q = S.cropping, W = img.clientWidth, H = img.clientHeight, P = i => [q[i][0] * W, q[i][1] * H];
    const [tl, tr, br, bl, mt, mb] = [0, 1, 2, 3, 4, 5].map(P);
    const ctl = (a, b, m) => [2 * m[0] - (a[0] + b[0]) / 2, 2 * m[1] - (a[1] + b[1]) / 2];
    const ct = ctl(tl, tr, mt), cb = ctl(bl, br, mb);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `<path d="M${tl} Q${ct} ${tr} L${br} Q${cb} ${bl} Z" class="edge"/>`
      + [tl, tr, br, bl].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13"/>`).join('')
      + [mt, mb].map(([x, y]) => `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" rx="4"/>`).join('');
  };
  if (img.complete) draw(); else img.onload = draw;
  let drag = -1;
  const showLoupe = (i, e) => {
    const r = img.getBoundingClientRect(), [x, y] = S.cropping[i], Z = 3, D = 110;
    loupe.hidden = false;
    loupe.style.left = Math.min(innerWidth - D - 8, Math.max(8, e.clientX - D / 2)) + 'px';
    loupe.style.top = Math.max(8, e.clientY - D - 60) + 'px';
    loupe.style.backgroundImage = `url("${img.src}")`;
    loupe.style.backgroundSize = `${r.width * Z}px ${r.height * Z}px`;
    loupe.style.backgroundPosition = `${D / 2 - x * r.width * Z}px ${D / 2 - y * r.height * Z}px`;
  };
  svg.onpointerdown = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    let best = -1, bd = 1e9;
    S.cropping.forEach(([x, y], i) => { const dd = Math.hypot((x - px) * r.width, (y - py) * r.height); if (dd < bd){ bd = dd; best = i; } });
    if (bd < 44){ drag = best; svg.setPointerCapture(e.pointerId); e.preventDefault(); showLoupe(best, e); }
  };
  svg.onpointermove = e => {
    if (drag < 0) return;
    const r = svg.getBoundingClientRect(), q = S.cropping;
    const nx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), ny = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (drag < 4){ // 角を動かしたら、隣の縁の中央も半分だけ一緒に動かす（曲がりを保つ）
      const dx = nx - q[drag][0], dy = ny - q[drag][1], mid = drag < 2 ? 4 : 5;
      q[mid] = [q[mid][0] + dx / 2, q[mid][1] + dy / 2];
    }
    q[drag] = [nx, ny];
    draw(); showLoupe(drag, e);
  };
  svg.onpointerup = svg.onpointercancel = () => { drag = -1; loupe.hidden = true; };
  S._drawCrop = draw;
}

/* ---------- 写真を取り込む ---------- */
let pickTarget = null;
function openPicker(camera){ pickTarget = S.scan; (camera ? $('#camIn') : $('#picIn')).click(); }
// 1枚の画像（写真・PDFのページ・カメラ）をフォルダに加える。found に四隅があればそれを使う
async function addPhotoCanvas(sc, c, found, fromPdf = false){
  let stage = '四隅の検出', out = null;
  try{
    if (!fromPdf && found === undefined){ try{ found = await findPage(c); }catch(e){ console.warn('detect', e); found = null; } }
    const p = { id: newId(), scan: sc.id, n: sc.pages.length + 1, corners: found ? found.corners : FULL, mids: found?.mids || null,
      profile: found?.profile || null, rotate: 0, filter: fromPdf ? 'color' : (lib().settings.filter || 'scan'), src: fromPdf ? 'pdf' : 'photo',
      status: 'new', md: '', tex: '', figs: [], issues: [], edited: false, error: '', found: !!found };
    stage = '元の写真の保存'; p.orig = await Store.upload(await toBlob(c, .9));
    stage = '補正';
    try{ out = renderFrom(c, p); }
    catch(e){ console.warn('render', e); Object.assign(p, { corners: FULL, mids: null, profile: null, filter: 'color', found: false }); out = renderFrom(c, p); toast('補正できなかったので、写真のまま取り込みました'); }
    stage = '補正後の保存'; p.img = await Store.upload(await toBlob(out, .88)); p.w = out.width; p.h = out.height;
    stage = 'データの保存';
    sc.pages.push(p.id); if (!sc.cover) sc.cover = p.img;
    await Store.savePage(p); await Store.saveLib();
    if (S.scan === sc.id){ S.pages.push(p); if (S.view === 'scan') render(); }
    return p;
  }catch(e){ e.stage = stage; throw e; }
  finally { freeCanvas(c, out); }
}
async function onFiles(files, fromCamera){
  if (!files?.length || !pickTarget) return;
  const sc = scanOf(pickTarget); if (!sc) return;
  const list = [...files]; let added = 0, lastAdded = null, failure = null;
  for (let i = 0; i < list.length; i++){
    try{
      if (isPdf(list[i])){
        toast('PDFを開いています…');
        await pdfPages(list[i], async (c, k, n) => { toast(`PDFを取り込み中… ${k}/${n}ページ`); lastAdded = await addPhotoCanvas(sc, c, null, true); added++; autoRead(lastAdded); });
      } else {
        toast(`取り込み中… ${i + 1}/${list.length}`);
        let c; try{ c = await fileToCanvas(list[i]); }catch(e){ e.stage = '写真の読み込み'; throw e; }
        lastAdded = await addPhotoCanvas(sc, c, undefined); added++; autoRead(lastAdded);
      }
    }catch(e){ console.error(e); Diag.log('import:' + (e.stage || ''), e); failure = failure || e; }
  }
  if (failure) return ask('notice', { title: '取り込めないものがありました', text: `段階：${failure.stage || '不明'}\n内容：${failure.message || failure.code || failure}` });
  if (fromCamera && lastAdded && S.scan === sc.id){
    S.page = lastAdded; S.view = 'page'; S.tab = 'image';
    S.cropping = cropFrom(lastAdded.corners, lastAdded.mids); S.cropProfile = lastAdded.profile; S.cropStart = JSON.stringify(S.cropping);
    S.review = true; render(); window.scrollTo(0, 0);
    if (!lastAdded.found) toast('紙の縁が見つかりませんでした。丸を四隅に合わせてください');
    return;
  }
  if (added) toast(added > 1 ? `${added}枚を取り込みました` : '取り込みました');
  if (S.view === 'scan') render();
}
$('#camIn').onchange = e => { onFiles(e.target.files, true); e.target.value = ''; };
$('#picIn').onchange = e => { onFiles(e.target.files); e.target.value = ''; };

async function reprocess(p, changes, quiet){
  Object.assign(p, changes);
  if (!quiet) toast('補正しています…');
  try{
    const out = await renderPage(p);
    const old = p.img;
    p.img = await Store.upload(await toBlob(out, .88)); p.w = out.width; p.h = out.height;
    const sc = scanOf(p.scan); if (sc && sc.cover === old){ sc.cover = p.img; Store.saveLib(); }
    await Store.savePage(p);
    Store.dropAsset(old);
    if (p.tex && !quiet) toast('画像を変えました。文字は「読み直す」で更新できます');
  }catch(e){ console.error(e); toast('補正できませんでした'); }
  if (!quiet) render();
}

/* ---------- 文字起こし ----------
   しくみ（Claude）：ページの「文字の行」の位置をアプリ側で先に測り、左の余白に行番号を書き込んだ画像を送る。
   Claude は番号ごとの文字を返すので、文字付きPDFでは文字がその行の位置にぴったり重なる。
   ページは3枚ずつ同時に読む。撮影した直後から裏で読み始める（設定で切り替え）。 */
const OQ = { q: [], running: 0, ctl: new AbortController() };
function oqAdd(p, mode = 'read'){
  if (p._q) return p._q;
  p.status = 'queued'; p.error = '';
  p._q = new Promise(res => OQ.q.push({ p, mode, res }));
  scheduleRender(); oqPump();
  return p._q;
}
function oqPump(){
  const max = lib().settings.engine === 'offline' ? 1 : 3;
  while (OQ.running < max && OQ.q.length){
    const job = OQ.q.shift(); OQ.running++;
    (async () => {
      let err = null;
      try{ await readPage(job.p, job.mode); }
      catch(e){
        err = e;
        if (e?.code === 'cancelled'){ job.p.status = job.p.tex ? 'done' : 'new'; }
        else { console.error('read failed', e); Diag.log('read', e); job.p.status = job.p.tex ? 'done' : 'error'; job.p.error = errText(e); await Store.savePage(job.p); }
        delete job.p.live;
        // キーがない・通信できないなどは、残りも同じなので止める
        if (['no_key', 'network', 'http_401', 'http_403'].includes(e?.code)) oqStop(e);
      } finally {
        OQ.running--; delete job.p._q; job.res(err); scheduleRender(); oqPump();
      }
    })();
  }
}
function oqStop(reason = { code: 'cancelled' }){
  OQ.ctl.abort(); OQ.ctl = new AbortController();
  for (const j of OQ.q){ j.p.status = j.p.tex ? 'done' : 'new'; delete j.p._q; j.res(reason); }
  OQ.q = []; scheduleRender();
}
const ocrPending = () => OQ.q.length + OQ.running;

// ---- 文字の行を見つける（文字1つ1つの塊 → 横に並んだものを1行にまとめる） ----
// 戻り値：[[x0,y0,x1,y1], …]（0〜1）。読む順（上から、同じ高さなら左から）
function findTextLines(canvas){
  const S0 = Math.min(1, 1500 / Math.max(canvas.width, canvas.height));
  const w = Math.round(canvas.width * S0), h = Math.round(canvas.height * S0), n = w * h;
  const c = makeCanvas(w, h), ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data; freeCanvas(c);
  const g = new Float32Array(n);
  for (let i = 0, k = 0; i < n; i++, k += 4) g[i] = d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11;
  // 1) まわりより暗いところ＝文字（積分画像で周囲の平均をとる）
  const ii = new Float64Array((w + 1) * (h + 1));
  for (let y = 0; y < h; y++){ let row = 0; for (let x = 0; x < w; x++){ row += g[y * w + x]; ii[(y + 1) * (w + 1) + x + 1] = ii[y * (w + 1) + x + 1] + row; } }
  const R = Math.max(8, Math.round(Math.max(w, h) / 45)), ink = new Uint8Array(n);
  for (let y = 0; y < h; y++){
    const y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
    for (let x = 0; x < w; x++){
      const x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
      const m = (ii[y1 * (w + 1) + x1] - ii[y0 * (w + 1) + x1] - ii[y1 * (w + 1) + x0] + ii[y0 * (w + 1) + x0]) / ((y1 - y0) * (x1 - x0));
      const v = g[y * w + x];
      if (v < m - Math.max(14, m * 0.14) && v < 215) ink[y * w + x] = 1;
    }
  }
  // 2) 長い罫線・枠線は文字ではないので消す
  const longH = Math.round(w * 0.06), longV = Math.round(h * 0.035);
  for (let y = 0; y < h; y++){ let s = -1; for (let x = 0; x <= w; x++){ const on = x < w && ink[y * w + x]; if (on && s < 0) s = x; if (!on && s >= 0){ if (x - s > longH) for (let k = s; k < x; k++) ink[y * w + k] = 2; s = -1; } } }
  for (let x = 0; x < w; x++){ let s = -1; for (let y = 0; y <= h; y++){ const on = y < h && ink[y * w + x] === 1; if (on && s < 0) s = y; if (!on && s >= 0){ if (y - s > longV) for (let k = s; k < y; k++) ink[k * w + x] = 2; s = -1; } } }
  // 3) 文字の塊（つながった黒い部分）
  const lab = new Int32Array(n), st = new Int32Array(n), comps = [];
  let L = 0;
  for (let s = 0; s < n; s++){
    if (ink[s] !== 1 || lab[s]) continue;
    L++; let top = 0; st[top++] = s; lab[s] = L;
    let x0 = w, y0 = h, x1 = 0, y1 = 0, cnt = 0;
    while (top){
      const p = st[--top], x = p % w, y = (p / w) | 0; cnt++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx; if (ink[q] === 1 && !lab[q]){ lab[q] = L; st[top++] = q; }
      }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    if (bh < h * 0.0025 && bw < h * 0.0025) continue;           // 点・ゴミ
    if (bh > h * 0.06 || bw > w * 0.12) continue;               // 図・写真・大きな模様
    if (cnt > bw * bh * 0.85 && bw > 6 && bh > 6) continue;     // べた塗りの四角
    comps.push({ x0, y0, x1, y1, cy: (y0 + y1) / 2, h: bh });
  }
  if (!comps.length) return [];
  // 罫線・枠のかけら（細長すぎるもの）を除く
  { const hs0 = comps.map(c => c.h).sort((a, b) => a - b), m0 = hs0[Math.floor(hs0.length * 0.6)] || 10;
    for (let i = comps.length - 1; i >= 0; i--){
      const c0 = comps[i], bw = c0.x1 - c0.x0 + 1, bh = c0.h;
      if ((bh > bw * 4 && bh > m0 * 1.8) || (bw > bh * 5 && bh < m0 * 0.45)) comps.splice(i, 1);
    } }
  if (!comps.length) return [];
  // 4) 横に並んだ塊を1行にまとめる（高さが重なり、間があきすぎていないもの）
  comps.sort((a, b) => a.x0 - b.x0);
  const par = comps.map((_, i) => i), find = i => { while (par[i] !== i){ par[i] = par[par[i]]; i = par[i]; } return i; };
  const hs = comps.map(c => c.h).sort((a, b) => a - b), mh = hs[Math.floor(hs.length * 0.6)] || 10;
  for (let i = 0; i < comps.length; i++){
    const a = comps[i];
    for (let j = i + 1; j < comps.length; j++){
      const b = comps[j];
      if (b.x0 - a.x1 > Math.max(a.h, b.h, mh) * 1.6) break;      // x順なので、ここから先は遠い
      const ov = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
      if (ov > Math.min(a.h, b.h) * 0.45 || (Math.abs(a.cy - b.cy) < mh * 0.35)) par[find(i)] = find(j);
    }
  }
  const groups = new Map();
  comps.forEach((c, i) => { const r = find(i); const g2 = groups.get(r); if (!g2) groups.set(r, { x0: c.x0, y0: c.y0, x1: c.x1, y1: c.y1, k: 1, area: (c.x1 - c.x0) * (c.y1 - c.y0) });
    else { g2.x0 = Math.min(g2.x0, c.x0); g2.y0 = Math.min(g2.y0, c.y0); g2.x1 = Math.max(g2.x1, c.x1); g2.y1 = Math.max(g2.y1, c.y1); g2.k++; } });
  const ex = w * 0.025, ey = h * 0.02; // 紙の縁ぎわに残った線のかけらは除く
  let lines = [...groups.values()].filter(l => (l.k >= 2 || (l.y1 - l.y0) > mh * 0.8) && (l.y1 - l.y0) > mh * 0.4
    && !((l.x1 < ex || l.x0 > w - ex || l.y1 < ey || l.y0 > h - ey) && (l.x1 - l.x0) < (l.y1 - l.y0) * 3));
  // 上下にほぼ重なる行（ルビ・上付き）はまとめる
  lines.sort((a, b) => a.y0 - b.y0);
  const merged = [];
  for (const l of lines){
    const m = merged.find(o => Math.min(o.x1, l.x1) - Math.max(o.x0, l.x0) > Math.min(o.x1 - o.x0, l.x1 - l.x0) * 0.5 && Math.min(o.y1, l.y1) - Math.max(o.y0, l.y0) > Math.min(o.y1 - o.y0, l.y1 - l.y0) * 0.5);
    if (m){ m.x0 = Math.min(m.x0, l.x0); m.y0 = Math.min(m.y0, l.y0); m.x1 = Math.max(m.x1, l.x1); m.y1 = Math.max(m.y1, l.y1); }
    else merged.push({ ...l });
  }
  // 5) 読む順：高さが重なる行どうしを「段」にして、段の中は左から
  merged.sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1));
  const bands = [];
  for (const l of merged){
    const cy = (l.y0 + l.y1) / 2, b = bands[bands.length - 1], lh = l.y1 - l.y0;
    // 同じ段：その行の高さの半分以上が、段の中心の行と重なる
    const ov = b ? Math.min(b.c1, l.y1) - Math.max(b.c0, l.y0) : 0;
    if (b && ov > Math.min(lh, b.c1 - b.c0) * 0.5) { b.items.push(l); }
    else bands.push({ c0: l.y0, c1: l.y1, items: [l] });
  }
  const pad = Math.max(1, mh * 0.15), out = [];
  for (const b of bands) for (const l of b.items.sort((p, q) => p.x0 - q.x0))
    out.push([Math.max(0, l.x0 - pad) / w, Math.max(0, l.y0 - pad) / h, Math.min(w, l.x1 + pad) / w, Math.min(h, l.y1 + pad) / h]);
  return out;
}

// ページの「文字の行」の位置（0〜1）。読む順
function textRows(canvas){
  let b = findTextLines(canvas);
  if (b.length > 220) b = b.slice(0, 220); // 極端に多いときは打ち切り（残りは近い番号に入る）
  return b;
}
// 各行の左に赤い番号をつけた画像（Claude用）。part: [上端, 下端]（0〜1）
async function annotated(canvas, rows, part = [0, 1], maxSide = 1568){
  const y0 = part[0] * canvas.height, y1 = part[1] * canvas.height, ch = y1 - y0;
  const margin = Math.round(canvas.width * 0.05);
  const s = Math.min(1, maxSide / Math.max(canvas.width + margin, ch));
  const c = makeCanvas((canvas.width + margin) * s, ch * s), ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(canvas, 0, y0, canvas.width, ch, margin * s, 0, canvas.width * s, ch * s);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  rows.forEach((r, i) => {
    const cy = ((r[1] + r[3]) / 2 * canvas.height - y0) * s; if (cy < -4 || cy > c.height + 4) return;
    const fs = Math.max(9, Math.min(16, (r[3] - r[1]) * canvas.height * s * 0.75));
    ctx.font = `bold ${fs}px -apple-system, Helvetica, sans-serif`;
    const label = String(i + 1), tw = ctx.measureText(label).width;
    const xr = (margin + r[0] * canvas.width) * s - 2;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(xr - tw - 2, cy - fs * 0.6, tw + 3, fs * 1.2);
    ctx.fillStyle = '#d0021b'; ctx.fillText(label, xr, cy);
  });
  try{ return await toBlob(c, .9); } finally { freeCanvas(c); }
}
const ROWS_RULES = `- 数式は LaTeX にして $...$ で囲む（例：$\\frac{1}{2}$, $x^2+1$, $\\sqrt{3}$, $\\int_0^1 f(x)\\,dx$）。その行全体が数式なら $$...$$。
- 表の行は、セルを「 | 」で区切って1行に書く。
- 見出しや問題番号もそのまま書く（(1)、【問題1】など）。ふりがな（ルビ）は書かない。
- 文字がない番号（図・写真・線だけ）は "" にする。
- 1つの番号のまとまりに文字の行が2つ以上あるときは、上から順に1つにつなぐ。番号のない所の文字は、いちばん近い番号に入れる。
- 番号は読む順についていますが、ずれていても気にせず、番号の右にある文字をそのまま書く。
- 画像にないことは書かない。読めない文字は〓にする。説明や感想は書かない。`;
function promptRows(n, twoImages){
  return `あなたは日本語の文書を正確に書き起こす専門家です。${twoImages ? '画像は同じ1ページを上下に分けたものです（真ん中あたりは両方に写っています）。' : '画像はスキャンした1ページです。'}
各行の左についている小さな赤い数字は、その右に続く文字のまとまり（1行）の番号です（1〜${n}）。番号ごとに、その右側に書かれている文字を正確に書き起こしてください。
${ROWS_RULES}
返事は次の形の JSON だけにしてください：{"rows": {"1": "…", "2": "…", …, "${n}": "…"}}`;
}
function promptRowsFix(n, twoImages, draft, issues){
  return promptRows(n, twoImages) + `

前回の書き起こし（下書き）があります。画像と1行ずつ照合して、誤り（誤字・数式の読み違い・抜け・行のずれ）を直してください。正しい行は変えないこと。
${issues?.length ? '自動チェックで見つかった問題：' + issues.join('、') + '\n' : ''}<draft>
${JSON.stringify({ rows: Object.fromEntries(draft.map((r, i) => [String(i + 1), r.text])) })}
</draft>`;
}
function parseRows(text, n){
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b < a) throw { code: 'bad_json', message: '返事を読み取れませんでした' };
  let j; try{ j = JSON.parse(text.slice(a, b + 1)); }catch{ throw { code: 'bad_json', message: '返事を読み取れませんでした' }; }
  const rows = j.rows || j;
  return Array.from({ length: n }, (_, i) => String(rows[String(i + 1)] ?? rows[i + 1] ?? '').trim());
}
// 行（番号つき）→ Markdown（TeX変換用）。行間が広いところで段落を分け、「 | 」の行は表にする
function rowsToMd(rows){
  const hs = rows.map(r => r.box[3] - r.box[1]).sort((a, b) => a - b), mh = hs[hs.length >> 1] || 0.02;
  const out = []; let prev = null, table = [];
  const flush = () => {
    if (!table.length) return;
    out.push('<table>' + table.map(r => '<tr>' + r.split('|').map(c => `<td>${esc(c.trim())}</td>`).join('') + '</tr>').join('') + '</table>', '');
    table = [];
  };
  for (const r of rows){
    const t = r.text.trim(); if (!t){ continue; }
    if (prev && r.box[1] - prev.box[3] > mh * 0.9){ flush(); out.push(''); }
    if (/\S\s\|\s\S/.test(t) && !/^\$\$/.test(t)) table.push(t);
    else { flush(); out.push(t); }
    prev = r;
  }
  flush();
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
// 検索・コピー用のふつうの文字（LaTeX を読みやすい形に）
const TEX_SYM = { cdot: '·', times: '×', div: '÷', pm: '±', le: '≤', leq: '≤', ge: '≥', geq: '≥', ne: '≠', neq: '≠', infty: '∞', pi: 'π', theta: 'θ', alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', Delta: 'Δ', omega: 'ω', lambda: 'λ', mu: 'μ', sigma: 'σ', Sigma: 'Σ', to: '→', rightarrow: '→', Rightarrow: '⇒', Leftrightarrow: '⇔', int: '∫', sum: 'Σ', prod: 'Π', angle: '∠', triangle: '△', circ: '°', degree: '°', therefore: '∴', because: '∵', in: '∈', subset: '⊂', cup: '∪', cap: '∩', ldots: '…', cdots: '…', quad: ' ', qquad: '  ', ',': ' ', ';': ' ', '!': '' };
function plainText(s){
  let t = s.replace(/\$\$?/g, '').replace(/\\\(|\\\)|\\\[|\\\]/g, '');
  for (let k = 0; k < 4; k++){
    t = t.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)')
         .replace(/\\sqrt\s*\[([^\]]*)\]\s*\{([^{}]*)\}/g, '$1√($2)').replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)')
         .replace(/\\(?:overrightarrow|vec|overline|bar|hat|mathrm|mathbf|bm|text|textbf|operatorname)\s*\{([^{}]*)\}/g, '$1')
         .replace(/\^\{([^{}]*)\}/g, '^$1').replace(/_\{([^{}]*)\}/g, '_$1');
  }
  t = t.replace(/\\left|\\right|\\displaystyle|\\limits/g, '').replace(/\\([A-Za-z]+|[,;!])/g, (_, n) => TEX_SYM[n] ?? n);
  return t.replace(/[{}]/g, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s*/, '').replace(/\s+/g, ' ').trim();
}

async function readPage(p, mode = 'read'){
  const st = lib().settings, engine = st.engine || 'claude';
  if (engine !== 'offline' && !st.apiKey) throw { code: 'no_key' };
  const canvas = await assetCanvas(p.img);
  const show = (label, live) => { p.status = label; p.live = live || ''; if (S.page?.id === p.id) render(); else scheduleRender(); };
  try{
    if (engine === 'offline' && mode !== 'fix'){
      show('reading', 'オフラインで読み取り中…');
      const off = await offlineRead(canvas, m => { p.live = m; const el = $('#live'); if (el && S.page?.id === p.id) el.textContent = m; });
      p.rows = off.rows; p.md = rowsToMd(p.rows); p.by = 'offline';
    } else {
      const rows = textRows(canvas), n = rows.length;
      const tier = engine === 'fast' ? 'quick' : (st.tier === 'complex' ? 'complex' : 'default');
      const two = st.hiRes && canvas.height > canvas.width * 1.2 && n > 0;
      if (!n){ // 文字の行が見つからない（図だけ・真っ白など）：ページ全体をそのまま読む
        show('reading', 'Claudeが読み取っています…');
        const blob = await annotated(canvas, [], [0, 1]);
        const r = await claudeCall(promptRead(1), [blob], { tier, signal: OQ.ctl.signal, maxTokens: 6000 });
        p.md = pickResult(r.text); p.rows = null; p.by = 'claude';
      } else {
        const imgs = two ? await Promise.all([annotated(canvas, rows, [0, 0.56]), annotated(canvas, rows, [0.44, 1])]) : [await annotated(canvas, rows)];
        const fix = mode === 'fix' && p.rows?.length === n;
        show(fix ? 'fixing' : 'reading', fix ? 'Claudeが画像と照合して見直しています…' : 'Claudeが読み取っています…');
        const prompt = fix ? promptRowsFix(n, two, p.rows, p.issues) : promptRows(n, two);
        const r = await claudeCall(prompt, imgs, { tier, signal: OQ.ctl.signal, maxTokens: Math.min(16000, 600 + n * 120),
          onText: ({ text }) => { const el = $('#live'); if (el && S.page?.id === p.id) el.textContent = text.replace(/[{}"]/g, '').replace(/\\n/g, '\n').replace(/,\s*/g, '\n').slice(-1200); } });
        const texts = parseRows(r.text, n);
        p.rows = rows.map((box, i) => ({ box, text: texts[i] }));
        p.md = rowsToMd(p.rows); p.by = engine === 'fast' ? 'claude-fast' : 'claude';
      }
    }
  } finally { freeCanvas(canvas); }
  const { tex, figs } = mdToTex(p.md, `p${String(p.n).padStart(2, '0')}`);
  Object.assign(p, { tex, figs, issues: p.by === 'offline' ? [] : checkMd(p.md, false), status: 'done', edited: false, error: '' });
  delete p.live;
  await Store.savePage(p);
}
async function runPages(list, mode = 'read'){
  if (!list.length) return toast('読むページがありません');
  if (lib().settings.engine !== 'offline' && !lib().settings.apiKey)
    return ask('notice', { title: 'APIキーが必要です', text: 'Claudeで読むには、「設定」でClaudeのAPIキーを入れてください。\n（APIキーなしで使うなら、設定で「オフライン」を選べます。精度は下がります）' });
  S.busy = { scan: S.scan, total: list.length, done: 0, label: '' };
  const t0 = Date.now(); let failure = null;
  const upd = () => { if (S.busy){ S.busy.label = `${S.busy.done}/${S.busy.total}ページ完了（同時に3ページずつ読んでいます）`; scheduleRender(); } };
  upd();
  await Promise.all(list.map(p => oqAdd(p, mode).then(e => { if (S.busy) S.busy.done++; if (e && e.code !== 'cancelled' && !failure) failure = e; upd(); })));
  S.busy = null; render();
  if (failure) return ask('notice', { title: '文字化できなかったページがあります', text: errText(failure) + (failure.code ? `（コード：${failure.code}）` : '') + '\n' + (HINT[failure.code] || '') });
  const warn = list.filter(p => p.issues?.length).length, sec = Math.round((Date.now() - t0) / 1000);
  if (list.every(p => p.status === 'done')) toast(`${list.length}ページ終わりました（${sec}秒）` + (warn ? `・要確認 ${warn}` : ''));
}

/* ---------- 書き出し ---------- */
async function save(filename, blob){
  const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
  // iPhone：共有シート（「"ファイル"に保存」やAirDrop、メールなど）
  if (navigator.canShare?.({ files: [file] })){
    try{ await navigator.share({ files: [file], title: filename }); return; }
    catch(e){ if (e?.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function exportTex(list = exportList()){ await save(safeName(scanOf(S.scan)?.name) + '.tex', new Blob([buildTexDoc(list)], { type: 'text/plain' })); }
const safeName = s => (s || 'scan').replace(/[\\/:*?"<>|]/g, '').trim() || 'scan';
const exportList = () => S.sheet?.list || S.pages;
async function exportPdf(list = exportList()){
  toast('PDFを作っています…');
  const pages = [];
  for (const p of list) pages.push({ canvas: await assetCanvas(p.img), md: p.md || '', rows: p.rows || null });
  // （buildPdf の中で1ページずつJPEGにしたあと手放す）
  await save(safeName(scanOf(S.scan)?.name) + '.pdf', await buildPdf(pages));
}
async function exportZip(list = exportList()){
  toast('TeXをまとめています…');
  const enc = new TextEncoder(), files = [{ name: 'main.tex', data: enc.encode(buildTexDoc(list)) }];
  for (const p of list) for (const f of p.figs || []){
    if (!p.tex.includes('figs/' + f.name)) continue;
    const c = await cropFig(p, f.box); files.push({ name: 'figs/' + f.name, data: new Uint8Array(await (await toBlob(c, .9)).arrayBuffer()) });
  }
  await save(safeName(scanOf(S.scan)?.name) + '.zip', buildZip(files));
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }
  catch{
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch{} ta.remove();
    toast(ok ? 'コピーしました' : 'コピーできませんでした。「LaTeXを編集」から選択してコピーしてください');
  }
}

/* ---------------------------------------------------------------------
   カメラ：撮影中に紙の四隅を追いかけ、止まったら自動で撮る（vFlat と同じ流れ）
   四隅の検出は裏の作業スレッド（Worker）で1秒に10回ほど行い、画面は止めない
   --------------------------------------------------------------------- */
const Cam = { stream: null, video: null, raf: 0, worker: null, pending: false, lastSent: 0, quad: null, shown: null, score: 0,
  hist: [], armed: true, shotQuad: null, lastShot: 0, shots: 0, queue: Promise.resolve(), misses: 0, small: null };
function camWorker(){
  if (Cam.worker !== null) return Cam.worker;
  try{
    const w = new Worker('detect-worker.js');
    w.onmessage = e => camResult(e.data);
    w.onerror = () => { Cam.worker = false; Cam.pending = false; };
    Cam.worker = w;
  }catch{ Cam.worker = false; }
  return Cam.worker;
}
async function openCamera(){
  if (!navigator.mediaDevices?.getUserMedia){ toast('このブラウザではカメラを直接使えません。写真で取り込みます'); return openPicker(true); }
  go('camera');
  try{
    Cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 }, aspectRatio: { ideal: 4 / 3 } } });
  }catch(e){
    Diag.log('camera', e); go('scan');
    return ask('notice', { title: 'カメラを使えませんでした', text: `理由：${e.name || e}\nSafariの「設定 → Safari → カメラ」を「許可」にしてから、もう一度試してください。\nかわりに「写真・PDF」から取り込むこともできます。` });
  }
  const v = $('#camVideo'); Cam.video = v; v.srcObject = Cam.stream;
  await v.play().catch(() => {});
  Object.assign(Cam, { quad: null, shown: null, score: 0, hist: [], shots: 0, misses: 0, armed: true, pending: false });
  camWorker();
  cancelAnimationFrame(Cam.raf); Cam.raf = requestAnimationFrame(camLoop);
}
function closeCamera(){
  cancelAnimationFrame(Cam.raf); Cam.raf = 0;
  Cam.stream?.getTracks().forEach(t => t.stop()); Cam.stream = null; Cam.pending = false;
}
function camLoop(now){
  if (!Cam.stream) return;
  Cam.raf = requestAnimationFrame(camLoop);
  const v = Cam.video;
  if (v && v.videoWidth && !Cam.pending && now - Cam.lastSent > 80){
    Cam.lastSent = now;
    const r = 300 / Math.max(v.videoWidth, v.videoHeight);
    if (!Cam.small) Cam.small = makeCanvas(1, 1);
    const c = Cam.small; c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
    const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(v, 0, 0, c.width, c.height);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const msg = { img: { data: id.data, width: id.width, height: id.height }, prev: Cam.quad };
    Cam.pending = true;
    const w = camWorker();
    if (w) w.postMessage(msg, [id.data.buffer]);
    else { let res = null; try{ res = DocDetect.detect(msg.img, msg.prev, { trackOk: 0.4, minScore: 0.15 }); }catch{} camResult(res); }
  }
  // 表示の枠はなめらかに追いかける
  if (Cam.quad){
    Cam.shown = Cam.shown ? Cam.shown.map((p, i) => [p[0] + (Cam.quad[i][0] - p[0]) * 0.45, p[1] + (Cam.quad[i][1] - p[1]) * 0.45]) : Cam.quad.map(p => p.slice());
  } else Cam.shown = null;
  drawCamOverlay();
}
function camResult(r){
  Cam.pending = false;
  const now = performance.now();
  if (r && r.score >= 0.28){
    Cam.quad = r.quad; Cam.score = r.score; Cam.misses = 0;
    Cam.hist.push({ t: now, q: r.quad }); while (Cam.hist.length && now - Cam.hist[0].t > 700) Cam.hist.shift();
  } else if (++Cam.misses > 2){ Cam.quad = null; Cam.score = 0; Cam.hist = []; }
  // 撮ったあとは、紙が替わる（見えなくなる・大きく動く）まで次を撮らない
  if (!Cam.armed && (!Cam.quad || !Cam.shotQuad || qdist(Cam.quad, Cam.shotQuad) > 0.08)) Cam.armed = true;
  if (lib().settings.auto && Cam.armed && camSteady() && now - Cam.lastShot > 900) shoot();
}
const qdist = (a, b) => Math.max(...a.map((p, i) => Math.hypot(p[0] - b[i][0], p[1] - b[i][1])));
// 0.45秒のあいだ、四隅がほとんど動いていない
function camSteady(){
  if (!Cam.quad || Cam.score < 0.38 || Cam.hist.length < 4) return false;
  const now = performance.now(), recent = Cam.hist.filter(h => now - h.t < 450);
  if (recent.length < 3 || now - Cam.hist[0].t < 420) return false;
  return recent.every(h => qdist(h.q, Cam.quad) < 0.012);
}
function drawCamOverlay(){
  const v = Cam.video, svg = $('#camSvg'), hint = $('#camHint'); if (!v || !svg || !v.videoWidth) return;
  const W = v.clientWidth, H = v.clientHeight, s = Math.min(W / v.videoWidth, H / v.videoHeight);
  const dw = v.videoWidth * s, dh = v.videoHeight * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!Cam.shown){ if (svg.innerHTML) svg.innerHTML = ''; if (hint) hint.textContent = '紙全体が画面に入るように写してください'; return; }
  const pts = Cam.shown.map(([x, y]) => `${(ox + x * dw).toFixed(1)},${(oy + y * dh).toFixed(1)}`).join(' ');
  const ready = Cam.score >= 0.38, steady = camSteady();
  svg.innerHTML = `<polygon points="${pts}" class="${ready ? 'ok' : ''}"/>`;
  if (hint) hint.textContent = !ready ? '紙の縁がはっきり見えるようにしてください' : !Cam.armed ? '撮りました。次の紙に替えてください' : lib().settings.auto ? (steady ? '撮影します' : 'そのまま動かさずに…') : '紙を見つけました。シャッターを押してください';
}
function shoot(){
  const v = Cam.video; if (!v || !v.videoWidth) return;
  Cam.lastShot = performance.now(); Cam.armed = false; Cam.shotQuad = Cam.quad;
  const full = makeCanvas(v.videoWidth, v.videoHeight); full.getContext('2d').drawImage(v, 0, 0);
  const quad = Cam.quad;
  $('#camFlash')?.classList.add('on'); setTimeout(() => $('#camFlash')?.classList.remove('on'), 140);
  navigator.vibrate?.(15);
  Cam.shots++; const cnt = $('#camCount'); if (cnt) cnt.textContent = `${Cam.shots}枚`;
  const sc = scanOf(S.scan);
  // 保存と補正は裏で順番に（撮影は止めない）。四隅は撮った写真の高い解像度で正確に合わせ直す
  Cam.queue = Cam.queue.then(async () => {
    let corners = quad;
    try{ if (corners) corners = refineQuad(full, corners); }catch{}
    const p = await addPhotoCanvas(sc, full, corners ? { corners, mids: null, profile: null, found: true } : null);
    autoRead(p);
  }).catch(e => { Diag.log('shoot', e); toast('保存できませんでした：' + (e.message || e)); });
}
// 撮った直後から裏で文字化しておく（設定で切り替え）
function autoRead(p){
  const st = lib().settings;
  if (p && st.autoOcr && (st.engine === 'offline' || st.apiKey)) oqAdd(p);
}

/* ---------- フォルダの操作 ---------- */
async function newFolder(open = true){
  const name = await ask('input', { title: '新しいフォルダ', placeholder: '例：中央大 2026', ok: '作る' });
  if (!name?.trim()) return null;
  const f = { id: newId(), name: name.trim(), created: Date.now(), pages: [], cover: '' };
  lib().folders.push(f); await Store.saveLib();
  if (open) go('scan', { scan: f.id, pages: [], sel: new Set() }); else render();
  return f;
}
async function openFolder(id){
  const f = scanOf(id); if (!f) return;
  go('scan', { scan: id, pages: [], sel: new Set() });
  S.pages = await Store.loadPages(f).catch(() => []);
  f.pages = f.pages.filter(pid => S.pages.some(p => p.id === pid));
  S.pages.forEach((p, i) => p.n = i + 1);
  render();
}
async function renumber(){
  const sc = scanOf(S.scan); sc.pages = S.pages.map(p => p.id);
  for (const [i, p] of S.pages.entries()) if (p.n !== i + 1){ p.n = i + 1; await Store.savePage(p); }
  sc.cover = S.pages[0]?.img || ''; await Store.saveLib();
}
const selected = () => S.pages.filter(p => S.sel.has(p.id));

/* ---------- タップの振り分け ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'sheetbg'){ if (e.target === b) closeSheet(null); return; }
  if (act === 'sheetclose') return closeSheet(null);
  if (act === 'sheetok') return closeSheet(S.sheet.kind === 'input' ? $('#sheetInput').value : true);
  switch (act){
    case 'back':
      if (S.view === 'page'){ if (S.cropping && !S.review){ S.cropping = null; return render(); } S.review = false; return go('scan'); }
      if (S.view === 'camera'){ closeCamera(); return go('scan'); }
      return go('home');
    case 'settings': return ask('settings', {});
    case 'savesettings': {
      const st = lib().settings; st.engine = document.querySelector('input[name=engine]:checked')?.value || 'auto';
      st.autoOcr = $('#autoOcr').checked; st.hiRes = $('#hiRes').checked; st.auto = $('#autoShot').checked;
      const k = $('#apiKey').value.trim(); if (k) st.apiKey = k;
      await Store.saveLib(); closeSheet(); return toast('保存しました');
    }
    case 'diag': {
      S.sheet = null; let est = ''; try{ const e = await navigator.storage.estimate(); est = `${Math.round(e.usage / 1e6)}MB 使用 / 空き約${Math.round((e.quota - e.usage) / 1e6)}MB`; }catch{}
      const text = `保存：${Store.mode === 'local' ? 'このiPhoneに保存' : 'できない'}　${est}
カメラ：${navigator.mediaDevices?.getUserMedia ? '使える' : '使えない'}　APIキー：${lib().settings.apiKey ? 'あり' : 'なし'}
読み取り方法：${{ claude: 'Claude・精度重視', fast: 'Claude・速さ重視', offline: 'オフライン' }[lib().settings.engine] || ''}

最近のエラー：
${Diag.errors.length ? Diag.errors.join('\n') : 'なし'}

${navigator.userAgent}`;
      return ask('notice', { title: '動作の状態', text });
    }
    case 'checkclaude': {
      S.sheet = null; toast('確認しています…');
      try{
        const r = await claudeCall('動作確認です。「OK」とだけ返してください。', [], { tier: 'quick', maxTokens: 20 });
        return ask('notice', { title: 'Claudeとつながっています', text: `返事：${r.text.trim().slice(0, 40)}` });
      }catch(e){ return ask('notice', { title: 'Claudeとつながっていません', text: errText(e) + '\n' + (HINT[e?.code] || '') }); }
    }
    case 'newfolder': return newFolder(true);
    case 'openfolder': return openFolder(id);
    case 'foldermenu': return ask('foldermenu', {});
    case 'renamefolder': { const f = scanOf(S.scan); S.sheet = null; const n = await ask('input', { title: 'フォルダ名', value: f.name, ok: '変更' }); if (n?.trim()){ f.name = n.trim(); await Store.saveLib(); render(); } return; }
    case 'delfolder': {
      const f = scanOf(S.scan); S.sheet = null;
      const ok = await ask('confirm', { title: `「${f.name}」を削除しますか？`, text: S.pages.length ? `中の${S.pages.length}枚の写真と文字もすべて消えます。元に戻せません。` : '空のフォルダを削除します。', ok: '削除', danger: true });
      if (!ok) return;
      for (const pg of S.pages){ await Store.deletePage(pg); Store.dropAsset(pg.orig); Store.dropAsset(pg.img); }
      lib().folders = lib().folders.filter(x => x.id !== f.id); await Store.saveLib(); return go('home');
    }
    case 'pickfolder': return closeSheet(id);
    case 'camera': return openCamera();
    case 'shutter': return shoot();
    case 'camdone': closeCamera(); await Cam.queue; return go('scan');
    case 'camauto': lib().settings.auto = !lib().settings.auto; Store.saveLib(); $('#camAutoBtn').textContent = lib().settings.auto ? '自動 ON' : '自動 OFF'; return;
    case 'campick': closeCamera(); go('scan'); return openPicker(false);
    case 'addphoto': if (S.sheet) closeSheet(null); return openPicker(false);
    case 'selall': S.sel = new Set(S.pages.map(p => p.id)); return render();
    case 'selnone': S.sel = new Set(); return render();
    case 'selmore': return ask('selmore', {});
    case 'selocr': {
      const list = selected();
      if (list.some(p => p.edited)){ const ok = await ask('confirm', { title: '読み直しますか？', text: '手で編集したページは上書きされます。', ok: '読む' }); if (!ok) return; }
      S.sel = new Set(); return runPages(list, 'read');
    }
    case 'selpdf': { const list = selected(); return exportPdf(list); }
    case 'selexport': { const list = selected(); S.sheet = null; return ask('export', { list }); }
    case 'selfilter': case 'selrot': {
      const list = selected(); closeSheet(null);
      for (const [i, pg] of list.entries()){
        toast(`整えています… ${i + 1}/${list.length}`);
        await reprocess(pg, act === 'selrot' ? { rotate: ((pg.rotate || 0) + 90) % 360 } : { filter: b.dataset.f }, true);
      }
      toast('変更しました'); return render();
    }
    case 'seldetect': {
      const list = selected().filter(pg => pg.src !== 'pdf'); closeSheet(null); let miss = 0;
      for (const [i, pg] of list.entries()){
        toast(`四隅を探しています… ${i + 1}/${list.length}`);
        const c = await assetCanvas(pg.orig), f = await findPage(c); freeCanvas(c);
        if (!f){ miss++; continue; }
        await reprocess(pg, { corners: f.corners, mids: f.mids, profile: f.profile || null }, true);
      }
      toast(miss ? `${miss}枚は紙の縁が見つかりませんでした。開いて「四隅を調整」で合わせてください` : '整え直しました'); return render();
    }
    case 'selmove': {
      const list = selected(); S.sheet = null;
      const r = await ask('pickfolder', { title: `${list.length}枚をどのフォルダへ？` }); if (!r) return;
      const to = r === '__new' ? await newFolder(false) : scanOf(r); if (!to) return;
      for (const pg of list){ pg.scan = to.id; pg.n = to.pages.length + 1; to.pages.push(pg.id); if (!to.cover) to.cover = pg.img; await Store.savePage(pg); }
      S.pages = S.pages.filter(q => !S.sel.has(q.id)); S.sel = new Set(); await renumber();
      toast(`「${to.name}」へ移しました`); return render();
    }
    case 'seldel': {
      const list = selected(); S.sheet = null;
      const ok = await ask('confirm', { title: `${list.length}枚を削除しますか？`, text: '写真と文字が消えます。元に戻せません。', ok: '削除', danger: true });
      if (!ok) return;
      for (const pg of list){ await Store.deletePage(pg); Store.dropAsset(pg.orig); Store.dropAsset(pg.img); }
      S.pages = S.pages.filter(q => !S.sel.has(q.id)); S.sel = new Set(); await renumber(); return render();
    }
    case 'ocrrest': S.sheet = null; return runPages(S.pages.filter(p => p.status !== 'done'));
    case 'openpage': {
      if (Date.now() < suppressUntil) return;
      if (S.sel.size){ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); return render(); } // 選択中はタップで追加・解除
      const pg = S.pages.find(p => p.id === id); return go('page', { page: pg, tab: pg?.tex ? 'text' : 'image' });
    }
    case 'pnav': { const i = S.pages.findIndex(p => p.id === S.page.id) + +b.dataset.d; if (S.pages[i]) go('page', { page: S.pages[i] }); return; }
    case 'tab': S.tab = b.dataset.tab; S.cropping = null; return render();
    case 'crop': S.cropping = cropFrom(S.page.corners || FULL, S.page.mids); S.cropProfile = S.page.profile || null; S.cropStart = JSON.stringify(S.cropping); return render();
    case 'autocorner': { const c = await assetCanvas(S.page.orig); toast('四隅を探しています…'); const f = await findPage(c); freeCanvas(c); if (!f) toast('紙の縁を見つけられませんでした。指で合わせてください'); S.cropping = f ? cropFrom(f.corners, f.mids) : cropFrom(FULL); S.cropProfile = f?.profile || null; S.cropStart = JSON.stringify(S.cropping); return S._drawCrop?.(); }
    case 'straight': S.cropping = cropFrom(S.cropping.slice(0, 4)); return S._drawCrop?.();
    case 'fullcorner': S.cropping = cropFrom(FULL); return S._drawCrop?.();
    case 'cropcancel': S.cropping = null; return render();
    case 'cropdone': {
      const review = S.review, next = b.dataset.next === '1'; S.review = false;
      if (next) setTimeout(openCamera, 0);
      const q = S.cropping, corners = q.slice(0, 4), mids = q.slice(4), sm = straightMids(corners);
      const bent = mids.some((m, i) => Math.hypot(m[0] - sm[i][0], m[1] - sm[i][1]) > 0.004);
      const untouched = JSON.stringify(q) === S.cropStart; // 自動検出の縁の形は、手で動かさなければそのまま使う
      S.cropping = null;
      if (review){
        const pg = S.page; go('scan');
        if (!untouched) await reprocess(pg, { corners, mids: bent ? mids : null, profile: null });
        return;
      }
      return reprocess(S.page, { corners, mids: bent ? mids : null, profile: untouched ? S.cropProfile : null });
    }
    case 'rot': return reprocess(S.page, { rotate: ((S.page.rotate || 0) + +b.dataset.d + 360) % 360 });
    case 'filter': lib().settings.filter = b.dataset.f; Store.saveLib(); return reprocess(S.page, { filter: b.dataset.f });
    case 'movepage': {
      const i = S.pages.findIndex(p => p.id === S.page.id), j = i + +b.dataset.d; if (j < 0 || j >= S.pages.length) return;
      [S.pages[i], S.pages[j]] = [S.pages[j], S.pages[i]]; await renumber(); toast(`${S.page.n}ページ目にしました`); return render();
    }
    case 'delpage': {
      const p = S.page; const ok = await ask('confirm', { title: `${p.n}ページを削除しますか？`, text: '写真と文字が消えます。元に戻せません。', ok: '削除', danger: true });
      if (!ok) return; S.pages = S.pages.filter(q => q.id !== p.id); await Store.deletePage(p); Store.dropAsset(p.orig); Store.dropAsset(p.img); await renumber(); return go('scan');
    }
    case 'ocr': return runPages(S.pages.filter(p => p.status !== 'done'));
    case 'readpage':
      if (S.page.edited){ const ok = await ask('confirm', { title: '読み直しますか？', text: '手で編集した内容は上書きされます。', ok: '読み直す' }); if (!ok) return; }
      return runPages([S.page], 'read');
    case 'fixpage':
      if (S.page.edited){ const ok = await ask('confirm', { title: '見直させますか？', text: '手で編集した内容は上書きされます。', ok: '見直す' }); if (!ok) return; }
      return runPages([S.page], 'fix');
    case 'stop': oqStop(); return;
    case 'edit': S.editing = !S.editing; if (!S.editing) await Store.savePage(S.page); return render();
    case 'copypage': return copyText(S.page.tex || '');
    case 'export': S.sheet = null; return ask('export', {});
    case 'exppdf': return exportPdf();
    case 'expzip': return exportZip();
    case 'exptex': return exportTex();
    case 'copyall': return copyText(buildTexDoc(exportList()));
  }
});

/* ---------- 起動 ---------- */
(async () => {
  render();
  await Store.init();
  render();
})();
</script>
